<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>物品記錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f8fa; --surface:#ffffff; --surface-2:#f1f3f7;
    --line:#e6e9ef; --line-strong:#d3d8e2;
    --ink:#0b0f19; --ink-2:#3a4355; --muted:#7b8496;
    --accent:#2563eb; --accent-ink:#1d4ed8; --accent-soft:#eaf0ff;
    --ok:#0f9d58; --ok-soft:#e6f6ee; --danger:#e02424; --danger-soft:#fdecec;
    --ring:0 0 0 3px rgba(37,99,235,.28);
    --sh-1:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
    --sh-2:0 4px 12px rgba(16,24,40,.08),0 2px 4px rgba(16,24,40,.04);
    --r:14px; --r-sm:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
    font-family:"Plus Jakarta Sans","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  svg{display:block;}
  .icon{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .icon-sm{width:16px;height:16px;}

  /* ---- header ---- */
  header{
    background:linear-gradient(135deg,#0b1220,#1e293b 60%,#243044);
    color:#fff; padding:calc(24px + env(safe-area-inset-top)) 20px 26px;
  }
  .head-inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;}
  .head-mark{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .head-mark .icon{width:24px;height:24px;stroke-width:2;}
  header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;}
  header p{margin:3px 0 0;opacity:.7;font-size:13px;}

  .wrap{max-width:1120px;margin:0 auto;padding:18px 16px 48px;}

  /* ---- stats ---- */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}
  @media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr);}}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh-1);}
  .stat .label{color:var(--muted);font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;}
  .stat .value{font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.02em;}

  /* ---- card ---- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);margin-bottom:18px;overflow:hidden;}
  .card-head{padding:15px 18px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;letter-spacing:-.01em;}
  .card-head .title{display:flex;align-items:center;gap:8px;}
  .card-body{padding:18px;}

  /* ---- form ---- */
  form.grid{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:640px){form.grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:end;}}
  label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:6px;font-weight:600;}
  input,select{width:100%;padding:11px 13px;border:1px solid var(--line-strong);border-radius:var(--r-sm);font-size:16px;background:var(--surface);color:var(--ink);font-family:inherit;transition:border-color .15s,box-shadow .15s;}
  input::placeholder{color:#aab2c0;}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring);}

  /* ---- buttons ---- */
  button{cursor:pointer;border:none;border-radius:var(--r-sm);padding:11px 16px;font-size:15px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .18s,color .18s,border-color .18s,box-shadow .18s;}
  button:focus-visible{outline:none;box-shadow:var(--ring);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-ink);}
  .btn-ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line-strong);}
  .btn-ghost:hover{background:var(--surface-2);color:var(--ink);}
  .btn-danger{background:var(--surface);color:var(--danger);border:1px solid #f3c2c2;}
  .btn-danger:hover{background:var(--danger-soft);}
  .btn-sm{padding:8px 12px;font-size:13px;}
  .btn-block{width:100%;}

  /* ---- toolbar ---- */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%;}
  .field-icon{position:relative;flex:1 1 160px;}
  .field-icon .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:17px;height:17px;pointer-events:none;}
  .field-icon input{padding-left:34px;}
  .toolbar select{flex:1 1 130px;}
  .toolbar .grow{flex-basis:100%;display:flex;gap:8px;}

  /* ---- photo picker ---- */
  .photo-pick{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .thumb-slot{width:64px;height:64px;border-radius:12px;border:1.5px dashed var(--line-strong);background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;color:var(--muted);}
  .thumb-slot img{width:100%;height:100%;object-fit:cover;}

  /* ---- item grid ---- */
  .items{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:560px){.items{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:920px){.items{grid-template-columns:repeat(3,1fr);}}
  .item{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--sh-1);transition:box-shadow .2s,transform .2s,border-color .2s;}
  .item:hover{box-shadow:var(--sh-2);border-color:var(--line-strong);transform:translateY(-2px);}
  .item-photo{aspect-ratio:16/10;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:#c2cad6;overflow:hidden;position:relative;}
  .item-photo.has-img{cursor:zoom-in;}
  .item-photo img{width:100%;height:100%;object-fit:cover;transition:transform .3s;}
  .item-photo.has-img:hover img{transform:scale(1.04);}
  .item-photo .icon{width:34px;height:34px;stroke-width:1.4;}
  .item-body{padding:14px 15px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .item-title{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;line-height:1.35;}
  .item-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13px;}
  .item-meta .k{color:var(--muted);font-size:11px;font-weight:500;}
  .item-meta .v{color:var(--ink);font-weight:700;letter-spacing:-.01em;}
  .item-actions{display:flex;gap:8px;margin-top:auto;padding-top:2px;}
  .item-actions button{flex:1;}
  .tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink);}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .badge-using{background:var(--ok-soft);color:var(--ok);}
  .badge-done{background:var(--surface-2);color:var(--muted);}

  .empty{text-align:center;color:var(--muted);padding:48px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;}
  .empty .icon{width:40px;height:40px;stroke-width:1.4;color:var(--line-strong);}

  /* ---- dialog ---- */
  dialog{border:none;border-radius:18px;padding:0;box-shadow:var(--sh-2),0 24px 60px rgba(11,15,25,.28);max-width:520px;width:94%;color:var(--ink);}
  dialog::backdrop{background:rgba(11,15,25,.55);backdrop-filter:blur(2px);}
  .dlg-head{padding:17px 20px;border-bottom:1px solid var(--line);font-weight:800;font-size:16px;letter-spacing:-.01em;}
  .dlg-body{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .dlg-body .full{grid-column:1/-1;}
  .dlg-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--surface-2);}
  .hint{font-size:12px;color:var(--muted);font-weight:500;}

  /* ---- lightbox ---- */
  #lightbox{position:fixed;inset:0;background:rgba(11,15,25,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:24px;cursor:zoom-out;}
  #lightbox img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);}

  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}.item:hover{transform:none;}}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="head-mark" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>
    </div>
    <div>
      <h1>物品記錄</h1>
      <p>記錄你擁有的東西：何時開始用、花了多少、何時用完</p>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="stats" id="stats"></div>

  <!-- 新增 -->
  <div class="card">
    <div class="card-head"><span class="title">
      <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新增物品</span></div>
    <div class="card-body">
      <form class="grid" id="addForm">
        <div><label for="f_name">名稱 *</label><input id="f_name" required placeholder="例如：牙膏、跑鞋"></div>
        <div><label for="f_cat">分類</label><input id="f_cat" list="catList" placeholder="例如：日用品"><datalist id="catList"></datalist></div>
        <div><label for="f_price">金額</label><input id="f_price" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div>
        <div><label for="f_start">開始使用日期</label><input id="f_start" type="date"></div>
        <div><label for="f_end">用完日期（留空＝使用中）</label><input id="f_end" type="date"></div>
        <div>
          <label>照片</label>
          <div class="photo-pick">
            <div class="thumb-slot" id="f_thumb" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </div>
            <input type="file" id="f_photo" accept="image/*" capture="environment" style="display:none">
            <button type="button" class="btn-ghost btn-sm" id="f_photoBtn">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>選照片</button>
            <button type="button" class="btn-ghost btn-sm" id="f_photoClear" style="display:none">移除</button>
          </div>
        </div>
        <div><button class="btn-primary btn-block" type="submit">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新增物品</button></div>
      </form>
    </div>
  </div>

  <!-- 清單 -->
  <div class="card">
    <div class="card-head">
      <span class="title">
        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        物品清單 <span class="hint" id="count"></span>
      </span>
      <div class="toolbar">
        <div class="field-icon">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search" placeholder="搜尋名稱…" aria-label="搜尋名稱">
        </div>
        <select id="filterCat" aria-label="篩選分類"><option value="">全部分類</option></select>
        <select id="filterStatus" aria-label="篩選狀態">
          <option value="">全部狀態</option>
          <option value="using">使用中</option>
          <option value="done">已用完</option>
        </select>
        <select id="sortSel" aria-label="排序方式">
          <option value="start:-1">最新開始</option>
          <option value="start:1">最早開始</option>
          <option value="name:1">名稱 A→Z</option>
          <option value="price:-1">金額高→低</option>
          <option value="price:1">金額低→高</option>
          <option value="days:-1">使用天數多→少</option>
        </select>
        <div class="grow">
          <button class="btn-ghost btn-sm" id="btnExport" style="flex:1">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>匯出 CSV</button>
          <button class="btn-ghost btn-sm" id="btnImport" style="flex:1">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>匯入 CSV</button>
          <input type="file" id="fileInput" accept=".csv" style="display:none">
        </div>
        <div class="grow">
          <button class="btn-primary btn-sm" id="btnBackup" style="flex:1">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>完整備份（含照片）</button>
          <button class="btn-ghost btn-sm" id="btnRestore" style="flex:1">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>還原備份</button>
          <input type="file" id="restoreInput" accept=".json,application/json" style="display:none">
        </div>
        <div class="grow">
          <button class="btn-ghost btn-sm" id="btnSyncSettings" style="flex:1">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>雲端同步設定</button>
          <button class="btn-ghost btn-sm" id="btnSyncNow" style="flex:1">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>立即同步</button>
        </div>
        <div class="hint" id="syncNote" style="flex-basis:100%"></div>
        <div class="hint" id="storageNote" style="flex-basis:100%"></div>
      </div>
    </div>
    <div class="card-body">
      <div class="items" id="items"></div>
      <div class="empty" id="emptyMsg" style="display:none">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>
        <span>還沒有任何物品，從上方新增吧。</span>
      </div>
    </div>
  </div>
</div>

<!-- 編輯對話框 -->
<dialog id="editDlg" aria-label="編輯物品">
  <div class="dlg-head">編輯物品</div>
  <div class="dlg-body">
    <div class="full"><label for="e_name">名稱 *</label><input id="e_name" required></div>
    <div><label for="e_cat">分類</label><input id="e_cat" list="catList"></div>
    <div><label for="e_price">金額</label><input id="e_price" type="number" inputmode="decimal" min="0" step="0.01"></div>
    <div><label for="e_start">開始使用日期</label><input id="e_start" type="date"></div>
    <div><label for="e_end">用完日期（留空＝使用中）</label><input id="e_end" type="date"></div>
    <div class="full">
      <label>照片</label>
      <div class="photo-pick">
        <div class="thumb-slot" id="e_thumb" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </div>
        <input type="file" id="e_photo" accept="image/*" capture="environment" style="display:none">
        <button type="button" class="btn-ghost btn-sm" id="e_photoBtn">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>選照片</button>
        <button type="button" class="btn-ghost btn-sm" id="e_photoClear" style="display:none">移除</button>
      </div>
    </div>
  </div>
  <div class="dlg-foot">
    <button type="button" class="btn-ghost" id="e_cancel">取消</button>
    <button type="button" class="btn-primary" id="e_save">儲存</button>
  </div>
</dialog>

<!-- 同步設定 -->
<dialog id="syncDlg" aria-label="雲端同步設定">
  <div class="dlg-head">雲端同步設定（GitHub）</div>
  <div class="dlg-body" style="grid-template-columns:1fr;">
    <div class="full hint" style="line-height:1.6">
      設定後，這台裝置會與 GitHub 私人 repo 同步：<b>打開時自動拉取最新，變更後自動上傳</b>。
      手機與電腦各設定一次（同一組 repo 與 token），即可看到同一份紀錄。
    </div>
    <div><label for="s_owner">GitHub 帳號</label><input id="s_owner" placeholder="kaojia"></div>
    <div><label for="s_repo">Repo 名稱</label><input id="s_repo" placeholder="item-tracker-data"></div>
    <div><label for="s_path">檔案路徑</label><input id="s_path" placeholder="data.json"></div>
    <div>
      <label for="s_token">存取權杖 Token（fine-grained）</label>
      <input id="s_token" type="password" placeholder="github_pat_..." autocomplete="off">
      <div class="hint" style="margin-top:6px;line-height:1.5">
        只存在本機瀏覽器，不會上傳。建立方式：GitHub → Settings → Developer settings →
        Fine-grained tokens → 只授權此 repo、權限 <b>Contents: Read and write</b>。
      </div>
    </div>
  </div>
  <div class="dlg-foot" style="justify-content:space-between;">
    <button type="button" class="btn-danger btn-sm" id="s_clear">清除設定</button>
    <div style="display:flex;gap:10px;">
      <button type="button" class="btn-ghost" id="s_cancel">取消</button>
      <button type="button" class="btn-primary" id="s_save">儲存並同步</button>
    </div>
  </div>
</dialog>

<div id="lightbox"><img id="lightboxImg" alt="物品照片放大"></div>

<script>
const KEY = "item-tracker-v1";
let items = load();
let editingId = null, sortBy = "start", sortDir = -1;
let pendingPhoto = null;    // 新增：dataURL 或 null
let editPhoto = undefined;  // 編輯：undefined=不變, null=移除, dataURL=新照片

const ICON = {
  box:'<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>',
  check:'<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',
  cash:'<svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
  layers:'<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 2l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5"/></svg>',
  edit:'<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>',
  trash:'<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',
  imgPlaceholder:'<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>'
};

/* ---------- 儲存 ---------- */
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function save(){ localStorage.setItem(KEY, JSON.stringify(items)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* ---------- IndexedDB（照片） ---------- */
let dbP = new Promise((res,rej)=>{
  const r = indexedDB.open("item-tracker-photos", 1);
  r.onupgradeneeded = ()=> r.result.createObjectStore("photos");
  r.onsuccess = ()=> res(r.result);
  r.onerror = ()=> rej(r.error);
});
async function photoGet(id){ const db=await dbP; return new Promise(res=>{ const rq=db.transaction("photos").objectStore("photos").get(id); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null); }); }
async function photoPut(id,data){ const db=await dbP; return new Promise(res=>{ const rq=db.transaction("photos","readwrite").objectStore("photos").put(data,id); rq.onsuccess=()=>res(); rq.onerror=()=>res(); }); }
async function photoDel(id){ const db=await dbP; return new Promise(res=>{ const rq=db.transaction("photos","readwrite").objectStore("photos").delete(id); rq.onsuccess=()=>res(); rq.onerror=()=>res(); }); }
async function photoAll(){ const db=await dbP; return new Promise(res=>{ const out={}; const rq=db.transaction("photos").objectStore("photos").openCursor(); rq.onsuccess=e=>{ const c=e.target.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; rq.onerror=()=>res(out); }); }
async function photoClear(){ const db=await dbP; return new Promise(res=>{ const rq=db.transaction("photos","readwrite").objectStore("photos").clear(); rq.onsuccess=()=>res(); rq.onerror=()=>res(); }); }

/* 壓縮圖片為 dataURL（最長邊 1000px, JPEG） */
function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const max=1000, s=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.8));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("圖片讀取失敗")); };
    img.src=url;
  });
}

/* ---------- 計算 ---------- */
function daysBetween(a,b){ if(!a) return null; const s=new Date(a), e=b?new Date(b):new Date(); return Math.max(0, Math.round((e-s)/86400000)); }
function fmtMoney(n){ return (n||n===0) ? "$"+Number(n).toLocaleString("zh-Hant",{maximumFractionDigits:2}) : "—"; }
function decorate(it){ const days=daysBetween(it.start,it.end); return {...it, days, perDay:(it.price&&days)?it.price/days:null, using:!it.end}; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- 渲染 ---------- */
async function render(){
  const cats=[...new Set(items.map(i=>i.category).filter(Boolean))].sort();
  document.getElementById("catList").innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join("");
  const fc=document.getElementById("filterCat"), cur=fc.value;
  fc.innerHTML='<option value="">全部分類</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join("");
  fc.value=cur;

  const q=document.getElementById("search").value.trim().toLowerCase();
  const fcat=fc.value, fstat=document.getElementById("filterStatus").value;
  let rows=items.map(decorate).filter(i=>{
    if(q && !i.name.toLowerCase().includes(q)) return false;
    if(fcat && i.category!==fcat) return false;
    if(fstat==="using" && !i.using) return false;
    if(fstat==="done" && i.using) return false;
    return true;
  });
  rows.sort((a,b)=>{ let x=a[sortBy],y=b[sortBy]; if(x==null)return 1; if(y==null)return -1; return typeof x==="string"? x.localeCompare(y,"zh-Hant")*sortDir : (x-y)*sortDir; });

  const all=items.map(decorate);
  const total=all.reduce((s,i)=>s+(Number(i.price)||0),0);
  const using=all.filter(i=>i.using).length;
  const usingCost=all.filter(i=>i.using).reduce((s,i)=>s+(Number(i.price)||0),0);
  document.getElementById("stats").innerHTML=`
    <div class="stat"><div class="label">${ICON.box}物品總數</div><div class="value">${all.length}</div></div>
    <div class="stat"><div class="label">${ICON.check}使用中</div><div class="value" style="color:var(--ok)">${using}</div></div>
    <div class="stat"><div class="label">${ICON.cash}累積花費</div><div class="value">${fmtMoney(total)}</div></div>
    <div class="stat"><div class="label">${ICON.layers}使用中資產值</div><div class="value">${fmtMoney(usingCost)}</div></div>`;

  document.getElementById("count").textContent=`（${rows.length} 筆）`;
  const box=document.getElementById("items");
  box.innerHTML=rows.map(i=>`
    <div class="item">
      <div class="item-photo" data-photo="${i.id}">${ICON.imgPlaceholder}</div>
      <div class="item-body">
        <div class="item-title"><span>${esc(i.name)}</span>${i.using?'<span class="badge badge-using">使用中</span>':'<span class="badge badge-done">已用完</span>'}</div>
        <div class="item-meta">
          <div><div class="k">分類</div><div class="v">${i.category?`<span class="tag">${esc(i.category)}</span>`:"—"}</div></div>
          <div><div class="k">金額</div><div class="v">${fmtMoney(i.price)}</div></div>
          <div><div class="k">開始使用</div><div class="v">${i.start||"—"}</div></div>
          <div><div class="k">${i.using?"用完":"用完日"}</div><div class="v">${i.end||"—"}</div></div>
          <div><div class="k">${i.using?"已使用":"共使用"}</div><div class="v">${i.days!=null?i.days+" 天":"—"}</div></div>
          <div><div class="k">每日成本</div><div class="v">${i.perDay!=null?fmtMoney(i.perDay.toFixed(2)):"—"}</div></div>
        </div>
        <div class="item-actions">
          <button class="btn-ghost btn-sm" onclick="editItem('${i.id}')">${ICON.edit}編輯</button>
          <button class="btn-danger btn-sm" onclick="delItem('${i.id}')">${ICON.trash}刪除</button>
        </div>
      </div>
    </div>`).join("");
  document.getElementById("emptyMsg").style.display=items.length===0?"flex":"none";

  box.querySelectorAll(".item-photo").forEach(async el=>{
    const data=await photoGet(el.dataset.photo);
    if(data){ el.classList.add("has-img"); el.innerHTML=`<img src="${data}" alt="物品照片">`; el.onclick=()=>openLightbox(data); }
  });
}

/* ---------- 照片選取 UI ---------- */
function wirePhotoPicker(btnId, inputId, clearId, thumbId, onPick){
  const input=document.getElementById(inputId), thumb=document.getElementById(thumbId), clr=document.getElementById(clearId);
  document.getElementById(btnId).onclick=()=>input.click();
  input.onchange=async()=>{
    if(!input.files[0]) return;
    try{ const data=await compress(input.files[0]); onPick(data); thumb.innerHTML=`<img src="${data}" alt="預覽">`; clr.style.display=""; }
    catch(e){ alert(e.message); }
    input.value="";
  };
  clr.onclick=()=>{ onPick(null); thumb.innerHTML=ICON.imgPlaceholder; clr.style.display="none"; };
}
wirePhotoPicker("f_photoBtn","f_photo","f_photoClear","f_thumb", d=>pendingPhoto=d);
wirePhotoPicker("e_photoBtn","e_photo","e_photoClear","e_thumb", d=>editPhoto=d);

/* ---------- CSV（照片不含在內） ---------- */
function csvCell(v){ v=String(v??""); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
document.getElementById("btnExport").addEventListener("click", ()=>{
  const head=["名稱","分類","金額","開始使用","用完日期"];
  const lines=[head.join(",")].concat(items.map(i=>[i.name,i.category||"",i.price??"",i.start||"",i.end||""].map(csvCell).join(",")));
  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`物品記錄_${new Date().toISOString().slice(0,10)}.csv`; a.click(); URL.revokeObjectURL(a.href);
});
document.getElementById("btnImport").addEventListener("click", ()=>fileInput.click());
document.getElementById("fileInput").addEventListener("change", e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const rows=parseCSV(r.result.replace(/^﻿/,""));
      if(rows.length<2){ alert("CSV 沒有資料列。"); return; }
      const added=rows.slice(1).filter(c=>c[0]&&c[0].trim()).map(c=>({
        id:uid(), name:(c[0]||"").trim(), category:(c[1]||"").trim(),
        price:c[2]?Number(c[2]):null, start:(c[3]||"").trim(), end:(c[4]||"").trim() }));
      if(!added.length){ alert("找不到可匯入的列。"); return; }
      if(confirm(`匯入 ${added.length} 筆物品？（會加到現有清單）`)){ items=items.concat(added); save(); await render(); }
    }catch(err){ alert("匯入失敗："+err.message); }
    fileInput.value="";
  };
  r.readAsText(file);
});
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else { if(ch==='"') q=true; else if(ch===",") { row.push(cell); cell=""; }
      else if(ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else if(ch==="\r"){} else cell+=ch; } }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows;
}

});

/* ---------- 要求「持久化儲存」，降低被瀏覽器自動清除的機率 ---------- */
async function initStorage(){
  const note=document.getElementById("storageNote");
  if(navigator.storage && navigator.storage.persist){
    let persisted=await navigator.storage.persisted();
    if(!persisted) persisted=await navigator.storage.persist();
    note.textContent = persisted
      ? "✓ 已啟用持久化儲存，資料與照片不會被瀏覽器自動清除。仍建議定期「完整備份」。"
      : "⚠ 瀏覽器未授予持久化儲存，資料可能在空間不足時被清除，請定期「完整備份（含照片）」。";
  } else {
    note.textContent="⚠ 此瀏覽器不支援持久化儲存，請定期「完整備份（含照片）」。";
  }
}
initStorage();

/* ---------- GitHub 雲端雙向同步 ---------- */
const SYNC_KEY="item-tracker-sync";
let sync=loadSync();          // {owner,repo,path,token} 或 null
let remoteSha=null;           // 遠端 data.json 的 sha
let pushTimer=null, syncing=false;
function loadSync(){ try{ return JSON.parse(localStorage.getItem(SYNC_KEY))||null; }catch{ return null; } }
function saveSync(){ sync?localStorage.setItem(SYNC_KEY,JSON.stringify(sync)):localStorage.removeItem(SYNC_KEY); }
function utf8b64(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64utf8(s){ return decodeURIComponent(escape(atob(String(s).replace(/\s/g,"")))); }
function ghUrl(){ return `https://api.github.com/repos/${sync.owner}/${sync.repo}/contents/${encodeURIComponent(sync.path).replace(/%2F/g,"/")}`; }
function ghHeaders(){ return { "Authorization":`Bearer ${sync.token}`, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" }; }
function setSyncNote(txt,kind){ const n=document.getElementById("syncNote"); n.textContent=txt; n.style.color=kind==="err"?"var(--danger)":kind==="ok"?"var(--ok)":"var(--muted)"; }

async function ghGet(){
  const r=await fetch(ghUrl()+"?ref=main&t="+Date.now(),{headers:ghHeaders(),cache:"no-store"});
  if(r.status===404) return {exists:false};
  if(!r.ok) throw new Error(`讀取失敗 HTTP ${r.status}`);
  const j=await r.json();
  return {exists:true, sha:j.sha, data:JSON.parse(b64utf8(j.content))};
}
async function ghPut(payload, sha){
  const body={ message:`update ${new Date().toISOString()}`, content:utf8b64(JSON.stringify(payload)), branch:"main" };
  if(sha) body.sha=sha;
  const r=await fetch(ghUrl(),{method:"PUT",headers:ghHeaders(),body:JSON.stringify(body)});
  if(!r.ok){ const e=await r.json().catch(()=>({})); const err=new Error(e.message||`HTTP ${r.status}`); err.status=r.status; throw err; }
  return (await r.json()).content.sha;
}

async function pullFromRemote(){
  if(!sync) return;
  syncing=true; setSyncNote("同步中：拉取雲端資料…");
  try{
    const res=await ghGet();
    if(res.exists){
      remoteSha=res.sha;
      items=Array.isArray(res.data.items)?res.data.items:[];
      save();
      await photoClear();
      for(const [id,d] of Object.entries(res.data.photos||{})) await photoPut(id,d);
      await render();
      setSyncNote(`✓ 已從雲端同步（${items.length} 筆）`,"ok");
    } else {
      remoteSha=null;
      setSyncNote("雲端尚無資料，將於下次變更時建立。","");
      await pushToRemote(true); // 首次把本機推上去
    }
  }catch(e){ setSyncNote("同步失敗："+e.message,"err"); }
  syncing=false;
}

async function pushToRemote(force){
  if(!sync) return;
  syncing=true; setSyncNote("同步中：上傳變更…");
  try{
    const photos=await photoAll();
    const payload={ app:"item-tracker", version:1, updatedAt:new Date().toISOString(), items, photos };
    try{
      remoteSha=await ghPut(payload, remoteSha);
    }catch(e){
      if(e.status===409||e.status===422){ // sha 過期：抓最新 sha 後覆蓋（後存者為準）
        const res=await ghGet(); remoteSha=res.exists?res.sha:null;
        remoteSha=await ghPut(payload, remoteSha);
      } else throw e;
    }
    setSyncNote(`✓ 已上傳到雲端 · ${new Date().toLocaleTimeString("zh-Hant")}`,"ok");
  }catch(e){ setSyncNote("上傳失敗："+e.message,"err"); }
  syncing=false;
}

function schedulePush(){
  if(!sync) return;
  clearTimeout(pushTimer);
  setSyncNote("有變更，準備上傳…");
  pushTimer=setTimeout(()=>pushToRemote(), 1000);
}
